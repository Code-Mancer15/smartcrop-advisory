<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>SmartCrop – Login</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #e8f5e9, #c8e6c9);
      min-height: 100vh; display: flex;
      align-items: center; justify-content: center;
    }
    .card {
      background: white; padding: 2.5rem; border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.12); width: 380px; text-align: center;
    }
    h1 { color: #2e7d32; margin-bottom: 0.3rem; }
    .subtitle { color: #777; margin-bottom: 1.5rem; }
    .form-group { text-align: left; margin-bottom: 1rem; }
    label { display: block; font-weight: 600; margin-bottom: 0.3rem; color: #444; }
    input {
      width: 100%; padding: 0.7rem 1rem; border: 1.5px solid #ccc;
      border-radius: 8px; font-size: 1rem;
    }
    input:focus { border-color: #43a047; outline: none; }
    button {
      width: 100%; padding: 0.8rem; background: #43a047; color: white;
      border: none; border-radius: 8px; font-size: 1rem;
      font-weight: 600; cursor: pointer; margin-top: 0.5rem;
    }
    button:hover { background: #2e7d32; }
    .alert { background: #ffebee; color: #c62828; padding: 0.6rem 1rem;
      border-radius: 8px; margin-bottom: 1rem; font-size: 0.9rem; }
    .success { background: #e8f5e9; color: #2e7d32; }
  </style>
</head>
<body>
<div class="card">
  <h1>🌾 SmartCrop Advisory</h1>
  <p class="subtitle">Sign in to continue</p>

  <!-- Error message -->
  <div th:if="${param.error}" class="alert">
    Invalid username or password.
  </div>

  <!-- Logout message -->
  <div th:if="${param.logout}" class="alert success">
    You have been logged out.
  </div>

  <form th:action="@{/login}" method="post">
    <div class="form-group">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" placeholder="Enter username" required />
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Enter password" required />
    </div>
    <button type="submit">Login</button>
  </form>
</div>
</body>
</html>
