<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Sign Up - SmartCrop</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #e8f5e9, #ffffff);
            font-family: Arial, sans-serif;
        }

        .card {
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
    </style>
</head>

<body>
<div class="container d-flex justify-content-center align-items-center vh-100">

    <div class="card p-4" style="width: 400px;">
        <h3 class="text-center mb-3">🌾 SmartCrop Sign Up</h3>

        <form th:action="@{/signup}" method="post">

            <input type="text" class="form-control mb-3" placeholder="Full Name" name="name" required>

            <input type="email" class="form-control mb-3" placeholder="Email" name="email" required>

            <input type="password" class="form-control mb-3" placeholder="Password" name="password" required>

            <button class="btn btn-success w-100">Sign Up</button>

        </form>

        <p class="text-center mt-3">
            Already have an account?
            <a href="/">Login</a>
        </p>
    </div>

</div>
</body>
</html>
